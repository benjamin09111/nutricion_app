<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="64" cy="64" r="64" fill="url(#bgGrad)"/>

  <!-- Hair Back -->
  <path d="M38 46 C34 68 34 85 44 95 C40 85 40 68 44 52 Z" fill="url(#hairGrad)"/>
  <path d="M90 46 C94 68 94 85 84 95 C88 85 88 68 84 52 Z" fill="url(#hairGrad)"/>

  <!-- Shoulders & Coat -->
  <path d="M26 128 C26 102 44 92 64 92 C84 92 102 102 102 128 Z" fill="#ffffff"/>
  
  <!-- Scrub/Shirt (Mint/Teal) -->
  <path d="M52 94 L64 110 L76 94 Z" fill="#0d9488"/>

  <!-- Coat Lapels -->
  <path d="M44 96 L58 128 L28 128 Z" fill="#f1f5f9"/>
  <path d="M84 96 L70 128 L100 128 Z" fill="#f1f5f9"/>

  <!-- Stethoscope -->
  <path d="M48 98 C48 116 80 116 80 98" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="116" r="4.5" fill="#94a3b8" stroke="#047857" stroke-width="1.5"/>

  <!-- Neck -->
  <path d="M54 78 L54 94 C54 98 74 98 74 94 L74 78 Z" fill="#fbb040"/>

  <!-- Head / Face -->
  <ellipse cx="64" cy="62" rx="22" ry="26" fill="#fcd34d"/>

  <!-- Hair Front -->
  <path d="M42 54 C42 34 86 34 86 54 C82 40 46 40 42 54 Z" fill="url(#hairGrad)"/>
  <path d="M42 52 C52 46 64 48 72 44 C62 48 50 50 42 56 Z" fill="url(#hairGrad)"/>

  <!-- Eyes -->
  <circle cx="56" cy="62" r="2.5" fill="#1e293b"/>
  <circle cx="72" cy="62" r="2.5" fill="#1e293b"/>
  <path d="M53 58 C55 57 58 57 60 58" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M68 58 C70 57 73 57 75 58" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Cheeks -->
  <circle cx="51" cy="67" r="3" fill="#f87171" opacity="0.4"/>
  <circle cx="77" cy="67" r="3" fill="#f87171" opacity="0.4"/>

  <!-- Smile -->
  <path d="M59 72 C61 75 67 75 69 72" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
</svg>

